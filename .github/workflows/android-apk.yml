name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Inspect and Install Android SDK Platforms
        run: |
          echo "=== Pre-installed Android SDK platforms ==="
          ls -la $ANDROID_HOME/platforms
          echo "=== Installing platforms;android-35 and build-tools;35.0.0 ==="
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Test Suite
        run: npm test

      - name: Build Web Dist
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          if ! ./gradlew :app:assembleDebug --stacktrace > /tmp/gradle.log 2>&1; then
            cat /tmp/gradle.log | tail -n 60
            ERR_MSG=$(grep -A 6 "What went wrong:" /tmp/gradle.log | tr '\n' ' ')
            if [ -z "$ERR_MSG" ]; then
              ERR_MSG=$(grep -B 1 -A 4 "Caused by:" /tmp/gradle.log | tr '\n' ' ')
            fi
            echo "::error::$ERR_MSG"
            exit 1
          fi
          echo "=== All files in app/build/outputs ==="
          ls -la app/build/outputs/apk/debug/
          mkdir -p ../release-apk
          cp app/build/outputs/apk/debug/app-debug.apk ../release-apk/PulseFlow-v1.0.0-debug.apk
          ls -la ../release-apk/

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PulseFlow-Android-APK
          path: release-apk/PulseFlow-v1.0.0-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        with:
          tag_name: v1.0.0
          name: PulseFlow v1.0.0 (Android APK)
          make_latest: true
          body: |
            ## 📱 脉律 PulseFlow 安卓安装包

            - **应用名称**：脉律 PulseFlow
            - **版本**：v1.0.0
            - **构建状态**：GitHub Actions 云端自动构建完成
            - **功能包含**：昼夜节律精力日程、心流节律计时、精力分析周复盘、日常记账、心神解压工坊（转运木鱼 3D、赛博小烟、街艺打赏、引力星辰）
            
            ### ⬇️ 手机下载与安装说明
            直接在下方 **Assets** 列表中点击下载 **`PulseFlow-v1.0.0-debug.apk`**，即可直接在安卓手机上安装体验！
          files: release-apk/PulseFlow-v1.0.0-debug.apk
          draft: false
          prerelease: false
