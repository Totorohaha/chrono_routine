name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Install Dependencies
        run: npm ci

      - name: Run Test Suite
        run: npm test

      - name: Build Web Dist & Sync Capacitor Android
        run: npm run build:android

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: cd android && ./gradlew assembleDebug --stacktrace

      - name: Rename APK Output
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/PulseFlow-v1.0.0-debug.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PulseFlow-Android-APK
          path: release-apk/PulseFlow-v1.0.0-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release (On Tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-apk/PulseFlow-v1.0.0-debug.apk
          name: PulseFlow Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
